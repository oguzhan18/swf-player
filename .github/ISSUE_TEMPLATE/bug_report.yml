name: Bug report
description: Something is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Load ...
        3. See error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: Chrome 120, Safari 17, Firefox 121
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14, Windows 11, Ubuntu 22.04
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: SWF source
      options:
        - Local file
        - Remote URL
        - Recent list
    validations:
      required: true
